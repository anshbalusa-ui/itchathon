name: FitCheck
options:
  bundleIdPrefix: com.itchathon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
fileGroups:
  - DevelopmentAssets


settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  FitCheck:
    type: application
    platform: iOS
    sources:
      - path: Sources
    postBuildScripts:
      - name: Stage internal mesh only in Debug
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/DevelopmentAssets/FitCheckGeometricVest.fitmesh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/FitCheckDevelopmentAssets
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/FitCheckDevelopmentAssets"
          asset="${destination}/FitCheckGeometricVest.fitmesh"
          if [ "${CONFIGURATION}" = "Debug" ]; then
            /bin/mkdir -p "${destination}"
            /bin/cp -f "${SRCROOT}/DevelopmentAssets/FitCheckGeometricVest.fitmesh" "${asset}"
          else
            # Remove only this build phase's own generated fixture, never unrelated resources.
            /bin/rm -f "${asset}"
            if [ -d "${destination}" ]; then
              /bin/rmdir "${destination}"
            fi
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.itchathon.fitcheck
        INFOPLIST_FILE: Sources/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  FitCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FitCheck

  FitCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FitCheck
